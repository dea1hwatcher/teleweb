name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release version, as in module.prop (for example v0.1.14)
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android module (current tag or android branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || 'android' }}
          fetch-depth: 0

      - name: Switch to tag if dispatching for an existing tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ] && git rev-parse -q --verify "refs/tags/${{ github.event.inputs.tag }}" >/dev/null; then
            echo "Checking out tag ${{ github.event.inputs.tag }}"
            git checkout "refs/tags/${{ github.event.inputs.tag }}"
          fi

      - name: Validate module.prop version matches tag
        run: |
          ver=$(sed -n 's/^version=//p' module.prop | tr -d '\r')
          [ "$ver" = "$TAG" ] || { echo "::error::module.prop: version=$ver, tag is $TAG"; exit 1; }

      - name: Reject a forced GOMEMLIMIT in daemon launch scripts
        run: |
          # Match only an active export: a comment mentioning the variable is
          # fine. The runtime honours GOMEMLIMIT from the environment even
          # though the Go code no longer sets it, so an export here silently
          # re-enables the heap clamp (the v0.1.7-v0.1.9 GC death spiral).
          if git grep -nE '^[[:space:]]*export[[:space:]]+GOMEMLIMIT' -- '*.sh'; then
            echo "::error::a launch script exports GOMEMLIMIT; the Go fix does not take effect while it is set"
            exit 1
          fi

      - name: Checkout Windows branch
        uses: actions/checkout@v4
        with:
          ref: win
          path: build-win
          fetch-depth: 0

      - name: Checkout Linux branch
        uses: actions/checkout@v4
        with:
          ref: linux
          path: build-linux
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Android multi-arch module
        run: |
          python3 package_zip.py
          ls -lh teleweb-*.zip

      - name: Build Windows desktop packages
        shell: pwsh
        run: |
          cd build-win
          ./build_desktop.ps1

      - name: Build Linux desktop packages
        shell: pwsh
        run: |
          cd build-linux
          ./build_desktop.ps1

      - name: Collect and verify all release assets
        run: |
          mkdir -p dist-release
          cp teleweb-*.zip dist-release/
          find build-win/dist -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" \) -exec cp {} dist-release/ \;
          find build-linux/dist -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" \) -exec cp {} dist-release/ \;

          echo "=== Collected 14 Release Assets ==="
          ls -lh dist-release/

          count=$(ls -1 dist-release/ | wc -l)
          echo "Total assets count: $count"
          if [ "$count" -ne 14 ]; then
            echo "::error::Expected 14 assets, found $count"
            exit 1
          fi

      - name: Prepare release notes from changelog
        env:
          PYTHONIOENCODING: utf-8
          LC_ALL: C.UTF-8
        run: |
          python3 -c "
          import sys, re
          text = open('changelog.md', encoding='utf-8').read()
          m = re.search(r'### [^\n]*' + re.escape(sys.argv[1]) + r':\s*([\s\S]*?)(?=### |\Z)', text)
          notes = m.group(1).strip() if m else text
          open('release-notes.md', 'w', encoding='utf-8').write(notes + '\n')
          " "$TAG"

      - name: Publish GitHub Release with all 14 assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi
          gh release create "$TAG" dist-release/* --title "$TAG" --notes-file release-notes.md

      - name: Update update.json on master
        run: |
          set -eu
          code=$(sed -n 's/^versionCode=//p' module.prop | tr -d '\r')
          zip_file=$(ls dist-release/teleweb-v*.zip | head -n 1 | xargs -n 1 basename)
          rm -rf build-win build-linux dist-release release-notes.md teleweb-*.zip
          git fetch origin master
          git checkout -B master origin/master
          jq -n --arg v "$TAG" --argjson c "$code" \
                --arg z "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$zip_file" \
                --arg l "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/changelog.md" \
                '{version: $v, versionCode: $c, zipUrl: $z, changelog: $l}' > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet && exit 0
          git commit -m "update.json: $TAG"
          git push origin HEAD:master
