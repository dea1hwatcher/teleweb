name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release version, as in module.prop (for example v0.1.0)
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate module.prop version matches tag
        run: |
          ver=$(sed -n 's/^version=//p' module.prop | tr -d '\r')
          [ "$ver" = "$TAG" ] || { echo "::error::module.prop: version=$ver, tag is $TAG"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build multi-arch binaries and package zip
        run: |
          python3 package_zip.py
          ls -lh teleweb-*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          LC_ALL: C.UTF-8
        run: |
          python3 -c "
          import sys, re
          text = open('changelog.md', encoding='utf-8').read()
          m = re.search(r'### [^\n]*' + re.escape(sys.argv[1]) + r':\s*([\s\S]*?)(?=### |\Z)', text)
          notes = m.group(1).strip() if m else text
          open('release-notes.md', 'w', encoding='utf-8').write(notes + '\n')
          " "$TAG"

          zip_file=$(ls teleweb-*.zip | head -n 1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -q '\.zip$'; then
              echo "zip already attached"
            else
              gh release upload "$TAG" "$zip_file" --clobber
            fi
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$zip_file" --title "$TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

      - name: Update update.json on master
        run: |
          set -eu
          git fetch origin master
          git checkout -B master origin/master
          code=$(git show "$GITHUB_SHA:module.prop" | sed -n 's/^versionCode=//p' | tr -d '\r')
          zip_file=$(ls teleweb-*.zip | head -n 1)
          jq -n --arg v "$TAG" --argjson c "$code" \
                --arg z "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$zip_file" \
                --arg l "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/changelog.md" \
                '{version: $v, versionCode: $c, zipUrl: $z, changelog: $l}' > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet && exit 0
          git commit -m "update.json: $TAG"
          git push origin HEAD:master
