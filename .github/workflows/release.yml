name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Desktop release tag, as used in changelog.md (for example v0.1.5)
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject a forced GOMEMLIMIT in daemon launch scripts
        run: |
          # Match only an active export: a comment mentioning the variable is
          # fine. The runtime honours GOMEMLIMIT from the environment even
          # though the Go code no longer sets it, so an export here silently
          # re-enables the heap clamp (the v0.1.7-v0.1.9 GC death spiral).
          if git grep -nE '^[[:space:]]*export[[:space:]]+GOMEMLIMIT' -- '*.sh'; then
            echo "::error::a launch script exports GOMEMLIMIT; the Go fix does not take effect while it is set"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Build desktop packages (Windows)
        shell: pwsh
        run: ./build_desktop.ps1

      - name: Prepare release notes from changelog
        env:
          PYTHONIOENCODING: utf-8
          LC_ALL: C.UTF-8
        run: |
          python3 -c "
          import sys, re
          text = open('changelog.md', encoding='utf-8').read()
          m = re.search(r'### [^\n]*' + re.escape(sys.argv[1]) + r':\s*([\s\S]*?)(?=### |\Z)', text)
          notes = m.group(1).strip() if m else text
          open('release-notes.md', 'w', encoding='utf-8').write(notes + '\n')
          " "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

      - name: Attach desktop packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/tgws-windows-*.exe dist/*.zip dist/*.tar.gz --clobber
