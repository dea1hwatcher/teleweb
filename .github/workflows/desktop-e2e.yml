name: desktop-e2e

# Linux end-to-end run in a privileged container on PRs touching the engine,
# WebUI or desktop packaging: Go build + unit tests + iptables redirect ->
# tgws -> WSS -> Telegram DC2.
on:
  workflow_dispatch:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]
    paths:
      - "src/**"
      - "webroot/**"
      - "desktop/**"
      - "build_desktop.ps1"
      - ".github/workflows/desktop-e2e.yml"

jobs:
  linux-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux E2E image
        run: docker build -t teleweb-e2e -f desktop/linux/docker-e2e/Dockerfile .

      - name: Run privileged E2E
        run: |
          mkdir -p desktop/linux/docker-e2e/out
          docker run --rm --privileged \
            -v "$PWD/desktop/linux/docker-e2e/out:/out/logs" \
            teleweb-e2e

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teleweb-linux-e2e-logs
          path: desktop/linux/docker-e2e/out/
          if-no-files-found: ignore
